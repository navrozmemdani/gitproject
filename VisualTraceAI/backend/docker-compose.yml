services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: visualtrace
      POSTGRES_PASSWORD: visualtrace
      POSTGRES_DB: visualtrace
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visualtrace"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://visualtrace:visualtrace@db:5432/visualtrace
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
