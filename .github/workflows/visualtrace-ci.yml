name: VisualTrace AI CI

on:
  push:
    paths: ["VisualTraceAI/**", ".github/workflows/visualtrace-ci.yml"]
  pull_request:
    paths: ["VisualTraceAI/**", ".github/workflows/visualtrace-ci.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VisualTraceAI/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: visualtrace
          POSTGRES_PASSWORD: visualtrace
          POSTGRES_DB: visualtrace_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U visualtrace" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://visualtrace:visualtrace@localhost:5432/visualtrace_test
      TEST_DATABASE_URL: postgresql+asyncpg://visualtrace:visualtrace@localhost:5432/visualtrace_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: VisualTraceAI/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - name: Migrations apply cleanly and match the models
        run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
      - name: Reset schema for tests
        run: alembic downgrade base
      - run: pytest -q -p no:logging --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: VisualTraceAI/backend/test-results.xml

  android:
    name: Android build, tests, APK & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: VisualTraceAI/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.VT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VT_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "VT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "VT_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "VT_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KIND=production" >> "$GITHUB_ENV"
          else
            # No secrets configured: sign with a throw-away CI key so the release APK installs.
            # Such builds can NOT be uploaded to Google Play as updates of a production app.
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -storepass ci-only-pass -keypass ci-only-pass \
              -alias ci -keyalg RSA -keysize 2048 -validity 30 -dname "CN=VisualTrace CI (not for distribution)"
            echo "VT_KEYSTORE_PASSWORD=ci-only-pass" >> "$GITHUB_ENV"
            echo "VT_KEY_ALIAS=ci" >> "$GITHUB_ENV"
            echo "VT_KEY_PASSWORD=ci-only-pass" >> "$GITHUB_ENV"
            echo "SIGNING_KIND=ephemeral-ci" >> "$GITHUB_ENV"
          fi
          echo "VT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Unit & UI (Robolectric) tests
        run: ./gradlew --stacktrace :domain:test testDebugUnitTest
      - name: Lint
        run: ./gradlew --continue lintDebug
      - name: Build debug APK, release APK, release AAB and instrumentation APK
        run: ./gradlew assembleDebug assembleRelease bundleRelease assembleDebugAndroidTest
      - name: Show outputs
        run: |
          echo "Release signing: $SIGNING_KIND"
          find app/build/outputs -name "*.apk" -o -name "*.aab" | xargs ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: visualtrace-apks
          path: |
            VisualTraceAI/android/app/build/outputs/apk/debug/app-debug.apk
            VisualTraceAI/android/app/build/outputs/apk/release/app-release.apk
            VisualTraceAI/android/app/build/outputs/bundle/release/app-release.aab
            VisualTraceAI/android/app/build/outputs/apk/androidTest/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            VisualTraceAI/android/**/build/reports/tests/
            VisualTraceAI/android/**/build/reports/lint-results-*.html
            VisualTraceAI/android/**/build/test-results/
